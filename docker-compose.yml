services:
  kafka:
    image: apache/kafka:3.7.0
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "true"

  clickhouse:
    image: clickhouse/clickhouse-server:24.3
    environment:
      CLICKHOUSE_USER: default
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_DEFAULT_ACCESS_MANAGEMENT: 1
    volumes: [chdata:/var/lib/clickhouse]
    ulimits: { nofile: { soft: 262144, hard: 262144 } }

  api:
    build: { context: ., dockerfile: api/Dockerfile }
    command: uvicorn api.main:app --host 0.0.0.0 --port 8000
    environment: &env
      KAFKA_BOOTSTRAP: kafka:9092
      CLICKHOUSE_HOST: clickhouse
      WORKFLOW_DIR: /data/workflows
      EXAMPLES_DIR: /app/workflows
    volumes: [wfdata:/data/workflows]
    depends_on: [kafka, clickhouse]
    ports: ["8000:8000"]

  consumer:
    build: { context: ., dockerfile: api/Dockerfile }
    command: python -m pipeline.consumer
    environment: *env
    depends_on: [kafka, clickhouse]
    restart: on-failure

  ui:
    build: { context: ./editor }
    ports: ["3000:80"]
    depends_on: [api]

volumes: { chdata: {}, wfdata: {} }
